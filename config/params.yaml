# ============================================================================
# HVF 파이프라인 전역 설정 — 단일 출처(single source of truth)
# ----------------------------------------------------------------------------
# 규칙: 파이프라인/분석 코드에 상수를 절대 하드코딩하지 말고 전부 여기서 읽는다.
#       값을 바꾸면 그 값을 쓰는 모든 스크립트가 함께 바뀌어야 한다.
# 로드: from hvf.config import load_config, get, seed, ...
# ============================================================================

# 결정론(reproducibility)
seed: 42                      # train.py set_seed 와 동일. random/numpy/torch/PYTHONHASHSEED 에 적용

# ----------------------------------------------------------------------------
# 경로
#   - raw_*  : 원본 PHI 데이터. 로컬에만 존재하며 git·results 에 절대 커밋 금지.
#   - data/  : 파이프라인 중간·최종 산출물(비식별 대상). gitignore 됨.
#   - results/ : 논문 수치 registry(JSON). 숫자만 담기므로 git 추적 대상.
#   NOTE: raw 경로는 사용자 로컬 머신 기준. 다른 환경에선 여기만 고치면 됨.
# ----------------------------------------------------------------------------
paths:
  # 아래 raw_* 3개는 로컬 머신 전용 placeholder — 원본 PHI 리포트 아카이브는
  # IRB 제한으로 레포에 포함되지 않는다. 실행 환경마다 실제 경로로 교체할 것.
  raw_vf:    "/path/to/raw_vf_archive"
  raw_oct:   "/path/to/raw_oct_archive"
  raw_zeiss: "/path/to/raw_zeiss_archive"
  data_dir:    "data"
  results_dir: "results"
  paper_dir:   "paper"
  tesseract:   "C:/Program Files/Tesseract-OCR/tesseract.exe"  # Windows 기본 설치 경로; Linux/Mac은 PATH의 tesseract 사용

# ----------------------------------------------------------------------------
# 실행 환경(재현 기록용). requirements.txt / ENVIRONMENT.md 와 일치해야 함.
# ----------------------------------------------------------------------------
environment:
  python:    "3.14.3"
  tesseract: "5.5.0.20241111"     # OCR 출력은 이 버전에 묶임. 버전 바뀌면 결정론 깨짐.

# ----------------------------------------------------------------------------
# 도메인 상수 — 기존 코드에 흩어져 있던 매직넘버를 여기로 집결
#   (출처 주석 = 현재 그 값이 하드코딩돼 있는 파일. 이관 시 이 config 를 가리키게 바꿈)
# ----------------------------------------------------------------------------
constants:
  vf:
    n_points: 54
    max_db: 40.0              # calc_ms 상한. 40 초과 = OCR 오류/맹점 마커로 제외 (kcc/analysis_ab.py)
    below_min_value: 0.0      # SFA "<0" 표기 → 0 dB floor 처리 (kcc/analysis_ab.py)
    defect_threshold_db: 15.0 # 결손 판정 컷 (결손률 히트맵, kcc/make_kcc_figs23.py DEFECT_THRESH)
    missing_sentinel: -1      # ml_final CSV 에서 맹점/결측 표기값
    blind_spot:               # 24-2 맹점 포인트 (baseline_xgb.py BLIND)
      OD: p33
      OS: p29

  matching:
    windows_days: [90]        # OCT-VF 측정일 허용 간격. 2026-07-23: ±180d는 논문에서
                               # 삭제(매칭 알고리즘 자체가 정본 파이프라인에 미구현 —
                               # 프로젝트 메모 참고). 코드가 논문에 없는 걸 약속하면 안 됨.
    primary_window_days: 90   # 메인 데이터셋 (의료진 협의 2026-05-13)

  oct:
    # OCT signal strength 최소 컷. 현재 코드에 미적용 상태 → 임상 확정 후 값 채울 것.
    # 확정 전까지 null. 파이프라인은 null 이면 "컷 미적용"으로 동작하도록 구현.
    signal_strength_min: null   # TODO(clinical): 확정 필요

  # --------------------------------------------------------------------------
  # OCR plausibility 범위 — 2026-07-23 GT(수동검수본, 276안) 관측범위로 재도출.
  # 기존 값(예: avg_gcl lo=40, min_gcl lo=20)은 외부 문헌 참고 없이 하드코딩된
  # 값이었고, GT 최솟값 대조 결과 실제 코호트 값을 오탐지-폐기하고 있었음이
  # 확인됨(avg_gcl_od GT min=24, avg_gcl_os GT min=25 — 둘 다 lo=40 미만).
  # 아래는 GT의 (min ~ max)에 작은 여유만 두고 잡은 값 — "외부 생리적 하한"이
  # 아니라 "이 코호트에서 관측된 범위"가 근거. avg_rnfl의 os 상한 이상치(234,
  # p99=113)는 lo에는 영향 없어 hi 변경 보류, 별도 확인 필요(플래그만 유지).
  # --------------------------------------------------------------------------
  plausibility:
    avg_gcl:        [20, 100]    # GT 24~99, lo 여유 4
    min_gcl:        [2, 100]     # GT 3~97,  lo 여유 1
    gca_sector:     [7, 200]     # GT 9~129(OS 4섹터가 9로 최저), lo 여유 2 (2026-07-23 수정: 5는 GT
                                  # 근거 없이 임의로 잡은 값이었음 — 그대로 두면 한 자릿수 오독까지 통과)
    rnfl_avg:       [30, 240]    # GT 31~234. 2026-07-23: 234는 리포트에 실제 인쇄된 값으로 크롭
                                  # 확인함(특정 사례, OS — 원본에 경고 아이콘(⚠)
                                  # 있고 같은 눈 다른 방문에서 quad-clock 불일치도 확인됨, 데이터
                                  # 품질 이슈 의심 사례). 필터로 버리는 대신 hi를 열어 통과시키고
                                  # cross_validate가 내적 불일치를 잡게 함(필터는 그 전에 값 자체를
                                  # 삭제해 CV가 실행될 기회를 없앴었음).
    rnfl_quadrant:  [6, 200]     # GT 8~158, lo 여유 2 (2026-07-23 수정: 위와 동일 사유로 5→6)
    rnfl_clockhour: [4, 300]     # GT 5~196, lo 여유 1(기존 5는 GT 최솟값과 정확히 겹쳐 마진 없었음)
    vert_cd:        [null, 0.99] # GT 0.05~0.96, 기존값이 이미 커버 — 변경 없음

  split:
    cv_folds: 5               # 환자 단위 5-fold (cv_fold 컬럼)

  cohort:
    test_pattern_include: ["24-2"]    # 포함할 VF test pattern. 10-2 배제 확정.
    rnfl_required: true               # RNFL 필수화(−4눈 비용, 일관성 우선). false로 변경 가능.

# ----------------------------------------------------------------------------
# 코호트 입력 파일 경로
# ----------------------------------------------------------------------------
cohort:
  dataset_csv: "kcc/dataset_final.csv"   # GCA 필수 340 페어. STEP 1 기준 입력.

# ----------------------------------------------------------------------------
# OCR 이미지 영역 상수
#   - SFA: 원본 JPG 기준 1240×1754 px (비율 보정으로 다른 크기에도 적용)
#   - GCA/RNFL: 원본 JPG 기준 1700×2200 px
# 규칙: 여기서 정의한 비율을 코드에서 하드코딩하지 않는다.
# ----------------------------------------------------------------------------
ocr:
  sfa:
    # 역치격자 크롭 (threshold_grid 영역, ocr_threshold.py FIXED_GRIDS 기준)
    # 2026-07-23: row3/4(맹점 인접 두 행) 좌우 col0 결측 버그 발견 — OD는 왼쪽,
    # OS는 오른쪽에서 한 칸씩 잘림(거울상 구조). "창 전체 이동"으로 시도했다가
    # row0,1,2,5,6,7의 col0까지 깨뜨려 되돌림(2026-07-23). 재설계 진행 중,
    # 값은 원복 상태.
    grid_crop: [0.2419, 0.2652, 0.5524, 0.4561]   # x1,y1,x2,y2 비율 (300,465,685,800)/1240×1754
    # 테스트 패턴 배너 ("Central 24-2 Threshold Test" 텍스트 위치)
    banner_crop: [0.4000, 0.1300, 1.0000, 0.1700]  # (496,228,1240,298)/1240×1754  ← 실측 수정

  gca:
    # GCL 두께표 (avg/min × 2안)
    gcl_table:   [0.3412, 0.5750, 0.7200, 0.6455]  # (580,1265,1224,1420)/1700×2200  ← OS컬럼 포함 위해 x_end 확장
    # GCA 섹터 지도 (6섹터)
    od_sectors:  [0.3176, 0.4741, 0.4647, 0.5727]  # (540,1043,790,1260)/1700×2200
    os_sectors:  [0.5882, 0.4741, 0.7353, 0.5727]  # (1000,1043,1250,1260)/1700×2200  ← 원 중심 abs(1125,1150) 기준 좌측 이동

  rnfl:
    # RNFL 요약표 (avg_rnfl + vert_cd × 2안)
    summary:     [0.3765, 0.1891, 0.7059, 0.3477]  # (640,416,1200,765)/1700×2200
    # RNFL 사분면 (quadrant × 2안). y2 0.7409→0.7909: 기존 경계가 I 값(사분면 파이
    # 바로 아래, 시계시간 12시 숫자 위)을 잘라내고 있었음 — 2026-07-16 실측 확인.
    quadrants:   [0.2000, 0.6495, 0.7235, 0.7909]  # (340,1429,1230,1740)/1700×2200
    # RNFL clock-hour (12시간 × 2안)
    clockhours:  [0.2000, 0.7409, 0.7235, 0.8591]  # (340,1630,1230,1890)/1700×2200

  signal_strength:
    # GCA·RNFL 헤더 "신호 강도: OD_val/10  OS_val/10" 위치 (두 리포트 동일 레이아웃)
    header_crop: [0.4588, 0.1295, 0.6765, 0.1523]  # (780,285,1150,335)/1700×2200
